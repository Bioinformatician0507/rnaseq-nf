name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Build DESeq2 Docker image
        run: docker build -t rnaseq-nf-deseq2:latest -f containers/Dockerfile.deseq2 .

      - name: Run pipeline on test profile
        run: nextflow run . -profile test,docker --outdir results_ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results_ci
